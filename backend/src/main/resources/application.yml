spring:
  application:
    name: room-booking-hexagonal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roombooking}
    username: ${DB_USERNAME:roombooking}
    password: ${DB_PASSWORD:roombooking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  zone: Europe/Paris
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    validity: ${JWT_VALIDITY:PT10H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    enabled: ${DEMO_DATA:false}
  no-show:
    # Fréquence de libération des salles sans présence confirmée
    check-interval: ${NO_SHOW_CHECK_INTERVAL:PT1M}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
